name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build practice.sln --configuration Release
      - name: Check menu
        shell: bash
        run: |
          output=$(printf '1\n5\n\n0\n2\n16\n\n19\n\n22\n\n0\n4\n' | dotnet run --no-build --configuration Release --project CSharpPracticum/CSharpPracticum/CSharpPracticum.csproj)
          echo "$output" | grep -q 'Стек Peek: 30'
          echo "$output" | grep -q 'Без аргументов: 0'
          echo "$output" | grep -q 'Палиндром: True'
      - name: Check incorrect input
        shell: bash
        run: |
          output=$(printf '1\n3\nabc\n2\n\n4\nnot-a-number\n\n0\n4\n' | dotnet run --no-build --configuration Release --project CSharpPracticum/CSharpPracticum/CSharpPracticum.csproj)
          echo "$output" | grep -q 'Неверное число'
